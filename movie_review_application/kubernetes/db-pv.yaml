apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv
  namespace: movie-review-namespace
  labels:
    app: postgres
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  hostPath:
    path: /var/lib/postgresql/data  # Make sure this path exists on your node
  persistentVolumeReclaimPolicy: Retain  # Optional, you can choose 'Delete' if you want PV to be deleted with PVC
  volumeMode: Filesystem